<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 804" width="560" height="804"><rect width="560" height="804" fill="#faf6f1"/><rect x="0" y="64" width="560" height="646" fill="#cfe3c8"/><rect x="0" y="64" width="560" height="646" fill="#dbe6ee"/><rect width="560" height="64" fill="#ffffff"/><circle cx="40" cy="32" r="20" fill="#e8670a"/><text x="40" y="38" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">BH</text><text x="72" y="28" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#000">Medpharm Brand Hub</text><text x="72" y="47" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8a8f94">bot</text><rect x="422" y="20" width="118" height="24" rx="12" fill="#fff3e8" stroke="#e8670a"/><text x="481" y="36" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#b95a12" text-anchor="middle" letter-spacing="1">CONCEPT DEMO</text><rect x="372" y="82" width="172" height="47" rx="14" fill="#effdde" /><text x="386" y="108" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111">Who is Saturex for?</text><rect x="16" y="141" width="362" height="241" rx="14" fill="#ffffff" /><text x="30" y="167" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111">Three segments in the Brand Hub:</text><text x="30" y="188" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111"></text><text x="30" y="209" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111">1. People living with chronic conditions</text><text x="30" y="230" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111">(type 2 diabetes, high blood pressure, blood</text><text x="30" y="251" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111">fat). This is the main focus.</text><text x="30" y="272" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111">2. Adults 35–55 who want to stay ahead of</text><text x="30" y="293" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111">illness.</text><text x="30" y="314" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111">3. Women 25–45 who care about figure and</text><text x="30" y="335" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111">skin.</text><text x="30" y="362" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3390ec">Source: 02-target-audience.md</text><rect x="288" y="394" width="256" height="47" rx="14" fill="#effdde" /><text x="302" y="420" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111">How should our captions sound?</text><rect x="16" y="453" width="347" height="241" rx="14" fill="#ffffff" /><text x="30" y="479" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111">Like a pharmacist giving advice, not a</text><text x="30" y="500" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111">salesperson.</text><text x="30" y="521" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111"></text><text x="30" y="542" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111">- Use specific numbers, e.g. “44% after 4</text><text x="30" y="563" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111">weeks”.</text><text x="30" y="584" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111">- Explain in plain words, no heavy medical</text><text x="30" y="605" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111">terms.</text><text x="30" y="626" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111">- Address readers as “cô chú, anh chị”.</text><text x="30" y="647" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111">- Always say Saturex is not a medicine.</text><text x="30" y="674" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3390ec">Source: 03-tone-of-voice.md</text><rect x="0" y="710" width="560" height="56" fill="#ffffff"/><rect x="16" y="720" width="480" height="36" rx="18" fill="#f1f3f4"/><text x="34" y="743" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8a8f94">Ask about the brand…</text><circle cx="524" cy="738" r="18" fill="#3390ec"/><path d="M517 731 L533 738 L517 745 Z" fill="#fff"/><line x1="0" y1="64" x2="560" y2="64" stroke="#e3e3e3"/><text x="16" y="790" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7a5a2e">Concept demo: answers are taken from the Brand Hub files. The live bot would reply in Vietnamese.</text></svg>